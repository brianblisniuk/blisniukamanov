# Netlify — Pasaporte Negro

[build]
  publish = "."

# Expediciones todavia no publicadas: la pagina no se sirve.
# El click abre el formulario de interes; sin JS cae en /contacto con el destino cargado.
# Para abrir una expedicion: borrar sus dos reglas de aca y sacar el slug de ABIERTAS en script.js.

